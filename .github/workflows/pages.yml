name: Deploy single player to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm # restores the pnpm store, keyed on pnpm-lock.yaml
      - uses: actions/configure-pages@v5
        id: pages
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm build:singleplayer
        env:
          APP_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-singleplayer
      - id: deployment
        uses: actions/deploy-pages@v4
